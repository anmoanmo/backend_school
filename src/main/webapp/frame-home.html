<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>框架首页</title>
    <link rel="stylesheet" href="assets/css/site.css">
</head>
<body class="frame-page">
<div class="frame-home">
    <p class="eyebrow">Legacy Frameset</p>
    <h1>旧式框架演示</h1>
    <p>左侧导航页和当前内容页分别显示在两个 frame 中，这就是早期 HTML 框架的基本思路。</p>
    <p>现代网页一般使用 CSS 布局和 <code>&lt;iframe&gt;</code>，但这个示例可以帮助你完成教材中的框架练习。</p>
</div>
</body>
</html>
